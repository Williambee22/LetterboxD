<!-- SHELDON_SECRET_SHOWS_V1: Invisible three-page Easter egg; no layout changes. -->
<script>
(() => {
  'use strict';
  const key = 'pb_sheldon_secret_stage_v1';
  const input = document.getElementById('yearFilterInput') || document.querySelector('#showsFilterForm input[name="year"]');
  if (!input) return;
  // Only clicking the Top Shows navigation link with the exact phrase counts.
  document.addEventListener('click', (event) => {
    const link = event.target.closest('a[href]');
    if (!link) return;
    let url;
    try { url = new URL(link.href, location.href); } catch (_) { return; }
    if (url.origin !== location.origin || url.pathname !== '/top') return;
    if (input.value.trim().toLowerCase() === '3or4') {
      sessionStorage.setItem(key, 'top');
    } else {
      sessionStorage.removeItem(key);
    }
  }, true);
})();
</script>
