<!-- SHELDON_SECRET_TOP_V1: Uses existing Lowest Critic Shows tab and ranking numbers. -->
<script>
(() => {
  'use strict';
  const key = 'pb_sheldon_secret_stage_v1';
  const mode = new URLSearchParams(location.search).get('mode') || 'top';
  const stage = sessionStorage.getItem(key);
  if (stage !== 'top' && stage !== 'critic') return;

  // Step 2: click the pre-existing Lowest Critic Shows filter (unchanged).
  if (mode !== 'critic_bottom') {
    if (stage !== 'top') { sessionStorage.removeItem(key); return; }
    document.addEventListener('click', (event) => {
      const a = event.target.closest('a[href]');
      if (!a) return;
      let url;
      try { url = new URL(a.href, location.href); } catch (_) { return; }
      if (url.origin === location.origin && url.pathname === '/top' && url.searchParams.get('mode') === 'critic_bottom') {
        sessionStorage.setItem(key, 'critic');
      }
    }, true);
    return;
  }

  if (stage !== 'critic') { sessionStorage.removeItem(key); return; }

  // Step 3: click the existing #3 or #4 ranking itself. Other rows behave normally.
  document.addEventListener('click', (event) => {
    const rank = event.target.closest('.ts_card .ts_rank');
    if (!rank) return;
    const card = rank.closest('.ts_card');
    const cards = Array.from(document.querySelectorAll('.ts_card'));
    const position = cards.indexOf(card) + 1;
    if (position !== 3 && position !== 4) return;
    event.preventDefault();
    event.stopPropagation();
    sessionStorage.removeItem(key);
    location.assign('/sheldon-results');
  }, true);
})();
</script>
